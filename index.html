<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURUM // TERMINAL v5.0</title>
    <style>
        /* ============================================================
           ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
           ============================================================ */
        :root {
            --bg: #050505;
            --panel: #0a0a0a;
            --border: rgba(255, 255, 255, 0.04);
            --text: #c8c8c8;
            --text-dim: #666;
            --text-bright: #f0f0f0;
            --green: #00ff41;
            --red: #ff1a1a;
            --cyan: #7df9ff;
            --glitch-color1: #ff1a1a;
            --glitch-color2: #7df9ff;
            --shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            --font: 'Share Tech Mono', 'Courier New', monospace;
            --ease: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* ============================================================
           СБРОС И БАЗА
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ============================================================
           ФОНОВЫЕ ЭФФЕКТЫ
           ============================================================ */

        /* Шум */
        .noise {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/%3E%3C/svg%3E");
            animation: noiseAnim 0.5s steps(2) infinite;
        }

        @keyframes noiseAnim {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-1%, 1%); }
            100% { transform: translate(1%, -1%); }
        }

        /* Сканирующая сетка */
        .grid {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.05;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Сканирующие линии (вертикальные) */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 3px,
                    rgba(0, 0, 0, 0.15) 3px,
                    rgba(0, 0, 0, 0.15) 4px);
            opacity: 0.3;
        }

        /* Горизонтальная сканирующая полоса (движется) */
        .scan-bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 2px;
            z-index: 3;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.015);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.03);
            animation: scanBarMove 6s linear infinite;
        }

        @keyframes scanBarMove {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        /* ============================================================
           ОСНОВНОЙ КОНТЕЙНЕР
           ============================================================ */
        .terminal-wrapper {
            position: relative;
            z-index: 10;
            width: min(1024px, 94vw);
            max-height: 94vh;
            border: 1px solid var(--border);
            background: var(--panel);
            box-shadow:
                inset 0 0 100px rgba(255, 255, 255, 0.005),
                var(--shadow),
                0 0 0 1px rgba(255, 255, 255, 0.015);
            overflow: hidden;
        }

        /* ============================================================
           ШАПКА
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: dotPulse 1.4s ease-in-out infinite;
            box-shadow: 0 0 8px var(--green);
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.2; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }

        .header-brand {
            color: var(--text-bright);
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        .header-right {
            display: flex;
            gap: 18px;
            font-size: 10px;
            letter-spacing: 0.08em;
            color: var(--text-dim);
        }

        .header-right span {
            color: var(--text);
        }

        /* ============================================================
           ТЕЛО ТЕРМИНАЛА
           ============================================================ */
        .terminal-body {
            position: relative;
            padding: 24px 28px 20px;
            min-height: 380px;
            max-height: 70vh;
            overflow-y: auto;
            overflow-x: hidden;
            font-size: 14px;
            line-height: 1.75;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.05) transparent;
        }

        .terminal-body::-webkit-scrollbar {
            width: 3px;
        }
        .terminal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
        }

        /* ============================================================
           СТРОКИ ТЕРМИНАЛА
           ============================================================ */
        .line {
            padding: 2px 0;
            opacity: 0;
            animation: typeIn 0.06s forwards;
            word-wrap: break-word;
        }

        @keyframes typeIn {
            0% { opacity: 0; transform: translateY(3px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .line.dim { color: var(--text-dim); }
        .line.bright { color: var(--text-bright); }
        .line.green { color: var(--green); text-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
        .line.red { color: var(--red); text-shadow: 0 0 10px rgba(255, 26, 26, 0.3); }
        .line.cyan { color: var(--cyan); text-shadow: 0 0 8px rgba(125, 249, 255, 0.15); }
        .line.separator {
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding: 0;
            margin: 10px 0;
            opacity: 1;
        }

        /* ============================================================
           ЗАДАНИЕ
           ============================================================ */
        .task-header {
            margin: 10px 0 6px;
        }
        .task-code {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 0.08em;
        }
        .task-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-bright);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 2px 0 4px;
        }
        .task-meta {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .task-meta .status {
            color: var(--green);
        }
        .task-meta .clearance {
            color: var(--red);
        }
        .task-body {
            padding: 8px 0 4px;
            color: var(--text);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 4px;
        }
        .task-body p {
            margin: 6px 0;
        }
        .task-body .redacted {
            color: var(--red);
            background: rgba(255, 26, 26, 0.05);
            padding: 0 4px;
            letter-spacing: 0.15em;
        }
        .task-body .code {
            color: var(--cyan);
            font-weight: 700;
        }

        /* ============================================================
           КНОПКИ
           ============================================================ */
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 22px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
            font-family: var(--font);
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all var(--ease);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.02);
            transform: translateX(-100%);
            transition: transform 0.4s ease;
        }

        .btn:hover::after {
            transform: translateX(0);
        }

        .btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-bright);
        }

        .btn-primary {
            border-color: rgba(0, 255, 65, 0.15);
            color: var(--green);
        }
        .btn-primary:hover {
            border-color: var(--green);
            background: rgba(0, 255, 65, 0.04);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.04);
        }

        .btn-danger {
            border-color: rgba(255, 26, 26, 0.12);
            color: var(--red);
        }
        .btn-danger:hover {
            border-color: var(--red);
            background: rgba(255, 26, 26, 0.04);
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.04);
        }

        .btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ============================================================
           ФУТЕР (ОТКЛЮЧЕНИЕ)
           ============================================================ */
        .footer {
            padding: 12px 24px 14px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            flex-wrap: wrap;
            gap: 6px;
        }

        .footer .blink {
            animation: blink 1.2s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .footer .time {
            color: var(--text);
        }

        /* ============================================================
           ГЛИТЧ-ЭФФЕКТЫ (периодические)
           ============================================================ */
        .glitch-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            background: rgba(255, 255, 255, 0.01);
            transition: opacity 0.05s ease;
        }

        .glitch-overlay.active {
            opacity: 1;
            animation: glitchFlash 0.12s ease;
        }

        @keyframes glitchFlash {
            0% { opacity: 0; background: rgba(255, 255, 255, 0.02); }
            20% { opacity: 1; background: rgba(255, 255, 255, 0.04); }
            40% { opacity: 0.3; background: rgba(255, 0, 0, 0.02); }
            60% { opacity: 0.8; background: rgba(0, 255, 255, 0.02); }
            80% { opacity: 0.4; background: rgba(255, 255, 255, 0.03); }
            100% { opacity: 0; }
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */
        @media (max-width: 640px) {
            .terminal-wrapper {
                width: 98vw;
                max-height: 98vh;
                border: none;
            }
            .header {
                padding: 10px 14px;
                font-size: 9px;
            }
            .header-left {
                gap: 8px;
            }
            .header-right {
                gap: 10px;
                font-size: 8px;
            }
            .terminal-body {
                padding: 16px 14px 14px;
                font-size: 12px;
                max-height: 62vh;
            }
            .task-title {
                font-size: 15px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 9px;
            }
            .footer {
                padding: 10px 14px;
                font-size: 8px;
            }
            .task-meta {
                font-size: 9px;
                gap: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
        ФОНОВЫЕ ЭФФЕКТЫ
        ============================================================ -->
    <div class="noise"></div>
    <div class="grid"></div>
    <div class="scanlines"></div>
    <div class="scan-bar"></div>
    <div class="glitch-overlay" id="glitchOverlay"></div>

    <!-- ============================================================
        ТЕРМИНАЛ
        ============================================================ -->
    <div class="terminal-wrapper" id="terminalWrapper">

        <!-- ШАПКА -->
        <header class="header">
            <div class="header-left">
                <span class="dot"></span>
                <span class="header-brand">AURUM</span>
                <span style="color:var(--text-dim);">|</span>
                <span>TERMINAL v5.0</span>
                <span style="color:var(--text-dim); font-size:9px;">SECURE</span>
            </div>
            <div class="header-right">
                <span>NODE: <span id="nodeId">WS-07</span></span>
                <span>|</span>
                <span>OP: <span id="opId">QUARTZ</span></span>
                <span>|</span>
                <span>LVL: <span style="color:var(--red);">3</span></span>
            </div>
        </header>

        <!-- ТЕЛО -->
        <div class="terminal-body" id="terminalBody">
            <div id="output"></div>
        </div>

        <!-- ФУТЕР -->
        <footer class="footer">
            <span>
                <span class="blink">▌</span> SESSION ACTIVE
            </span>
            <span>
                <span class="time" id="sessionTime">00:00:00</span>
                <span style="color:var(--text-dim); margin-left:12px;">AUTH: LVL-3</span>
            </span>
        </footer>
    </div>

    <!-- ============================================================
        JS
        ============================================================ -->
    <script>
        (() => {
            "use strict";

            // ============================================================
            // 1. ЭЛЕМЕНТЫ
            // ============================================================
            const output = document.getElementById('output');
            const terminalBody = document.getElementById('terminalBody');
            const terminalWrapper = document.getElementById('terminalWrapper');
            const glitchOverlay = document.getElementById('glitchOverlay');
            const sessionTimeEl = document.getElementById('sessionTime');

            // ============================================================
            // 2. ДАННЫЕ ЗАДАНИЯ
            // ============================================================
            const TASK = {
                code: 'OP-42/ALPHA',
                title: 'СБОР РАЗВЕДДАННЫХ // СЕКТОР 7',
                classification: 'TOP SECRET // EYES ONLY',
                status: 'АКТИВНО',
                clearance: 'LVL-3',
                body: [
                    'Цель: получить данные о передвижении отряда «ТЕНЬ» в секторе 7.',
                    'Объект: группа из 4–6 человек, вооружение лёгкое, без бронетехники.',
                    'Метод: скрытное наблюдение, фотофиксация, перехват коммуникаций.',
                    'Время выполнения: 72 часа.',
                    'Приоритет: ВЫСОКИЙ.',
                    'Кодовое слово для подтверждения: «ГОРИЗОНТ».'
                ]
            };

            // ============================================================
            // 3. ЛОГИ (ПОСЛЕДОВАТЕЛЬНОСТЬ ВЫВОДА)
            // ============================================================
            const LOGS = [
                { text: '> ПОДКЛЮЧЕНИЕ К СИСТЕМЕ AURUM...', cls: 'dim', delay: 280 },
                { text: '> ПРОВЕРКА КАНАЛА СВЯЗИ...', cls: 'dim', delay: 220 },
                { text: '> УСТАНОВЛЕНИЕ ЗАЩИЩЁННОГО СОЕДИНЕНИЯ...', cls: 'dim', delay: 320 },
                { text: '> ВЕРИФИКАЦИЯ УЧЁТНЫХ ДАННЫХ...', cls: 'dim', delay: 260 },
                { text: '> ДОСТУП РАЗРЁШЕН. ПРИВЕТСТВУЕМ, ОПЕРАТИВНИК QUARTZ.', cls: 'green', delay: 380 },
                { text: '> ЗАГРУЗКА ЗАДАНИЯ...', cls: 'dim', delay: 240 },
                { text: '> РАСШИФРОВКА ДАННЫХ...', cls: 'dim', delay: 310 },
                { text: '> ГОТОВО.', cls: 'green', delay: 180 },
                { text: '', cls: 'separator', delay: 80 },
                // Заголовок задания
                { text: `[ ${TASK.classification} ]`, cls: 'red', delay: 200 },
                { text: `# ${TASK.code}`, cls: 'dim', delay: 120 },
                { text: `[ СТАТУС: ${TASK.status} ]`, cls: 'green', delay: 160 },
                { text: `[ ДОПУСК: ${TASK.clearance} ]`, cls: 'red', delay: 140 },
                { text: '', cls: 'separator', delay: 100 },
                // Тело задания
                ...TASK.body.map((line, i) => ({
                    text: `  ${line}`,
                    cls: i === TASK.body.length - 1 ? 'bright' : '',
                    delay: 130
                })),
                { text: '', cls: 'separator', delay: 100 },
                { text: '> ЗАДАНИЕ ЗАГРУЖЕНО. ОЖИДАЙТЕ ДАЛЬНЕЙШИХ УКАЗАНИЙ.', cls: 'green', delay: 300 },
                { text: '> ДЛЯ ПОДТВЕРЖДЕНИЯ ВВЕДИТЕ КОДОВОЕ СЛОВО.', cls: 'dim', delay: 240 },
            ];

            // ============================================================
            // 4. ПЕЧАТЬ СТРОК
            // ============================================================
            let lineIndex = 0;
            let isCompleted = false;

            function typeLine() {
                if (lineIndex >= LOGS.length) {
                    if (!isCompleted) {
                        isCompleted = true;
                        showActions();
                    }
                    return;
                }

                const entry = LOGS[lineIndex];
                const div = document.createElement('div');
                div.className = `line ${entry.cls || ''}`.trim();
                div.textContent = entry.text || '\u00A0';
                output.appendChild(div);
                scrollToBottom();

                lineIndex++;
                const nextDelay = entry.delay || 200;
                setTimeout(typeLine, nextDelay);
            }

            function scrollToBottom() {
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }

            // ============================================================
            // 5. КНОПКИ ДЕЙСТВИЙ
            // ============================================================
            function showActions() {
                const container = document.createElement('div');
                container.className = 'actions';
                container.innerHTML = `
                    <button class="btn btn-primary" id="btnAccept">ПРИНЯТЬ</button>
                    <button class="btn btn-danger" id="btnReject">ОТКАЗАТЬСЯ</button>
                    <button class="btn" id="btnInfo">ЗАПРОС ДАННЫХ</button>
                `;
                output.appendChild(container);
                scrollToBottom();

                document.getElementById('btnAccept').addEventListener('click', () => {
                    addLine('> КОДОВОЕ СЛОВО ПРИНЯТО. ЗАДАНИЕ ПОДТВЕРЖДЕНО.', 'green');
                    addLine('> ОПЕРАТИВНИК QUARTZ, ВЫ НАЗНАЧЕНЫ ИСПОЛНИТЕЛЕМ.', 'bright');
                    addLine('> ВРЕМЯ ВЫПОЛНЕНИЯ: 72 ЧАСА.', 'dim');
                    disableButtons();
                });

                document.getElementById('btnReject').addEventListener('click', () => {
                    addLine('> ОТКАЗ ЗАФИКСИРОВАН. ЗАДАНИЕ БУДЕТ ПЕРЕДАНО ДРУГОМУ АГЕНТУ.', 'red');
                    addLine('> ВАШ ПРОФИЛЬ ПОМЕЧЕН. ОЖИДАЙТЕ СВЯЗИ С КОМАНДОВАНИЕМ.', 'dim');
                    disableButtons();
                });

                document.getElementById('btnInfo').addEventListener('click', () => {
                    addLine('> ЗАПРОС ДОПОЛНИТЕЛЬНЫХ ДАННЫХ ОТПРАВЛЕН.', 'dim');
                    addLine('> ОЖИДАЙТЕ ОТВЕТА В ТЕЧЕНИЕ 5 МИНУТ.', 'dim');
                });
            }

            function addLine(text, cls = '') {
                const div = document.createElement('div');
                div.className = `line ${cls}`.trim();
                div.textContent = text;
                output.appendChild(div);
                scrollToBottom();
            }

            function disableButtons() {
                document.querySelectorAll('.actions .btn').forEach(btn => {
                    btn.disabled = true;
                    btn.style.opacity = '0.25';
                });
                setTimeout(() => {
                    const div = document.createElement('div');
                    div.className = 'line dim';
                    div.textContent = '⏻ СЕССИЯ ЗАВЕРШЕНА. ОЖИДАЙТЕ НОВЫХ ЗАДАНИЙ.';
                    div.style.marginTop = '16px';
                    div.style.paddingTop = '14px';
                    div.style.borderTop = '1px solid rgba(255,255,255,0.03)';
                    div.style.fontSize = '11px';
                    div.style.color = '#444';
                    output.appendChild(div);
                    scrollToBottom();
                }, 600);
            }

            // ============================================================
            // 6. СЧЁТЧИК ВРЕМЕНИ
            // ============================================================
            let seconds = 0;

            function updateTime() {
                seconds++;
                const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
                const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                sessionTimeEl.textContent = `${h}:${m}:${s}`;
            }

            // ============================================================
            // 7. ГЛИТЧ-ЭФФЕКТЫ
            // ============================================================
            function triggerGlitch() {
                if (Math.random() > 0.12) return;
                glitchOverlay.classList.add('active');
                setTimeout(() => {
                    glitchOverlay.classList.remove('active');
                }, 120);
            }

            // ============================================================
            // 8. ЗАПУСК
            // ============================================================
            setTimeout(typeLine, 400);
            setInterval(updateTime, 1000);
            setInterval(triggerGlitch, 3500);

            // Дополнительные случайные сообщения (атмосфера)
            setInterval(() => {
                if (Math.random() > 0.6) return;
                const msgs = [
                    '> СИНХРОНИЗАЦИЯ ДАННЫХ...',
                    '> ПРОВЕРКА ЦЕЛОСТНОСТИ...',
