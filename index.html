<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURUM // TERMINAL v7.0</title>
    <style>
        /* ============================================================
           ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
           ============================================================ */
        :root {
            --bg: #000000;
            --panel: #080808;
            --border: rgba(255, 255, 255, 0.04);
            --text: #b8b8b8;
            --text-dim: #3a3a3a;
            --text-bright: #e8e8e8;
            --green: #00ff41;
            --red: #ff1a1a;
            --cyan: #7df9ff;
            --amber: #e6a800;
            --font: 'Courier New', monospace;
            --ease: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* ============================================================
           ФОНОВЫЕ ЭФФЕКТЫ
           ============================================================ */
        .noise {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/%3E%3C/svg%3E");
            animation: noiseAnim 0.4s steps(2) infinite;
        }

        @keyframes noiseAnim {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-1%, 1%); }
            100% { transform: translate(1%, -1%); }
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 3px,
                    rgba(0, 0, 0, 0.1) 3px,
                    rgba(0, 0, 0, 0.1) 4px);
            opacity: 0.4;
        }

        .scan-bar {
            position: fixed;
            left: 0;
            width: 100%;
            height: 1px;
            z-index: 2;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.008);
            animation: scanBarMove 8s linear infinite;
        }

        @keyframes scanBarMove {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        /* ============================================================
           ОСНОВНОЙ КОНТЕЙНЕР
           ============================================================ */
        .terminal-wrapper {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ============================================================
           ШАПКА
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 28px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 4px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--green);
            animation: dotPulse 1.4s ease-in-out infinite;
            box-shadow: 0 0 8px var(--green);
        }

        @keyframes dotPulse {
            0%,
            100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }

        .header-brand {
            color: var(--text-bright);
            font-weight: 700;
            letter-spacing: 0.15em;
        }

        .header-right {
            display: flex;
            gap: 14px;
            font-size: 9px;
            letter-spacing: 0.08em;
            color: var(--text-dim);
        }

        .header-right span {
            color: var(--text);
        }

        /* ============================================================
           ТЕЛО ТЕРМИНАЛА
           ============================================================ */
        .terminal-body {
            flex: 1;
            padding: 20px 28px 18px;
            overflow-y: auto;
            overflow-x: hidden;
            font-size: 13px;
            line-height: 1.7;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.04) transparent;
        }

        .terminal-body::-webkit-scrollbar {
            width: 3px;
        }
        .terminal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
        }

        /* ============================================================
           СТРОКИ ТЕРМИНАЛА
           ============================================================ */
        .line {
            padding: 1px 0;
            opacity: 0;
            animation: typeIn 0.05s forwards;
            word-wrap: break-word;
        }

        @keyframes typeIn {
            0% { opacity: 0; transform: translateY(2px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .line.dim { color: var(--text-dim); }
        .line.bright { color: var(--text-bright); }
        .line.green { color: var(--green); }
        .line.red { color: var(--red); }
        .line.cyan { color: var(--cyan); }
        .line.amber { color: var(--amber); }
        .line.separator {
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding: 0;
            margin: 8px 0;
            opacity: 1;
        }

        /* ============================================================
           ГЛАВНАЯ СТРАНИЦА (СЕТКА)
           ============================================================ */
        .main-grid {
            display: grid;
            grid-template-columns: 200px 1fr 240px;
            gap: 16px;
            height: 100%;
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Левое меню */
        .menu-panel {
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            padding-right: 14px;
            height: 100%;
            overflow-y: auto;
        }

        .menu-item {
            display: block;
            padding: 8px 10px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-left: 2px solid transparent;
            transition: all var(--ease);
            cursor: pointer;
            margin-bottom: 2px;
        }

        .menu-item:hover,
        .menu-item.active {
            color: var(--text-bright);
            border-left-color: var(--green);
            background: rgba(255, 255, 255, 0.015);
        }

        .menu-item.logout {
            margin-top: 16px;
            color: var(--red);
            border-left-color: transparent;
        }

        .menu-item.logout:hover {
            border-left-color: var(--red);
            background: rgba(255, 26, 26, 0.04);
        }

        /* Центр — контент */
        .content-panel {
            padding: 0 6px;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.04) transparent;
        }

        .content-panel::-webkit-scrollbar {
            width: 3px;
        }
        .content-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .content-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
        }

        .section-label {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        /* Карточка задания (РП-сообщение) */
        .task-card {
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all var(--ease);
        }

        .task-card:hover {
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.01);
        }

        .task-card .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }

        .task-card .task-code {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 0.08em;
        }

        .task-card .task-clearance {
            font-size: 8px;
            color: var(--red);
            letter-spacing: 0.1em;
            border: 1px solid rgba(255, 26, 26, 0.15);
            padding: 0 8px;
        }

        .task-card .task-title {
            font-size: 13px;
            color: var(--text-bright);
            margin: 2px 0 6px;
        }

        .task-card .task-preview {
            font-size: 11px;
            color: var(--text-dim);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-card .task-meta {
            font-size: 9px;
            color: var(--text-dim);
            display: flex;
            gap: 14px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .task-card .task-meta .status {
            color: var(--green);
        }

        /* Правая панель — лог */
        .log-panel {
            border-left: 1px solid rgba(255, 255, 255, 0.03);
            padding-left: 14px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.04) transparent;
            padding-right: 4px;
        }

        .log-container::-webkit-scrollbar {
            width: 3px;
        }
        .log-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
        }

        .log-entry {
            font-size: 9px;
            color: var(--text-dim);
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.015);
        }

        .log-entry .time {
            color: var(--text-dim);
            margin-right: 8px;
        }

        .log-entry .action {
            color: var(--text);
        }

        .log-entry .action-green {
            color: var(--green);
        }

        .log-entry .action-red {
            color: var(--red);
        }

        /* ============================================================
           ДЕТАЛЬНОЕ ЗАДАНИЕ
           ============================================================ */
        .detail-view {
            padding: 4px 0;
        }

        .detail-view .back-btn {
            font-size: 9px;
            color: var(--text-dim);
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: var(--font);
            letter-spacing: 0.08em;
            padding: 4px 0;
            margin-bottom: 10px;
        }

        .detail-view .back-btn:hover {
            color: var(--text-bright);
        }

        .detail-view .detail-header {
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 14px 16px;
            margin-bottom: 10px;
        }

        .detail-view .detail-header .line {
            font-size: 11px;
            padding: 2px 0;
            opacity: 1;
            animation: none;
        }

        .detail-view .detail-body {
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 16px;
            font-size: 12px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .detail-view .detail-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-dim);
            font-family: var(--font);
            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all var(--ease);
        }

        .btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-bright);
        }

        .btn-primary {
            border-color: rgba(0, 255, 65, 0.1);
            color: var(--green);
        }
        .btn-primary:hover {
            border-color: var(--green);
            background: rgba(0, 255, 65, 0.03);
        }

        .btn-danger {
            border-color: rgba(255, 26, 26, 0.08);
            color: var(--red);
        }
        .btn-danger:hover {
            border-color: var(--red);
            background: rgba(255, 26, 26, 0.03);
        }

        .btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ============================================================
           АРХИВ (ЗАГЛУШКА)
           ============================================================ */
        .archive-placeholder {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        .archive-placeholder .empty {
            color: var(--text-dim);
            font-size: 10px;
        }

        /* ============================================================
           ФУТЕР
           ============================================================ */
        .footer {
            padding: 8px 28px 10px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 4px;
        }

        .footer .blink {
            animation: blink 1.2s step-end infinite;
        }

        @keyframes blink {
            0%,
            100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .footer .time {
            color: var(--text);
        }

        /* ============================================================
           ГЛИТЧ-ЭФФЕКТ
           ============================================================ */
        .glitch-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            background: rgba(255, 255, 255, 0.01);
            transition: opacity 0.05s ease;
        }

        .glitch-overlay.active {
            opacity: 1;
            animation: glitchFlash 0.12s ease;
        }

        @keyframes glitchFlash {
            0% { opacity: 0; background: rgba(255, 255, 255, 0.02); }
            20% { opacity: 1; background: rgba(255, 255, 255, 0.04); }
            40% { opacity: 0.3; background: rgba(255, 0, 0, 0.02); }
            60% { opacity: 0.8; background: rgba(0, 255, 255, 0.02); }
            80% { opacity: 0.4; background: rgba(255, 255, 255, 0.03); }
            100% { opacity: 0; }
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */
        @media (max-width: 820px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .menu-panel {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.03);
                padding-right: 0;
                padding-bottom: 8px;
                display: flex;
                flex-wrap: wrap;
                gap: 2px;
                height: auto;
            }
            .menu-item {
                padding: 4px 10px;
                font-size: 8px;
                border-left: none;
                border-bottom: 2px solid transparent;
                margin-bottom: 0;
            }
            .menu-item:hover,
            .menu-item.active {
                border-left: none;
                border-bottom-color: var(--green);
            }
            .menu-item.logout {
                margin-top: 0;
            }
            .log-panel {
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.03);
                padding-left: 0;
                padding-top: 8px;
                height: 200px;
            }
            .header {
                padding: 6px 14px;
                font-size: 8px;
            }
            .header-left {
                gap: 6px;
            }
            .header-right {
                gap: 8px;
                font-size: 7px;
            }
            .terminal-body {
                padding: 12px 14px 10px;
                font-size: 11px;
            }
            .task-card .task-title {
                font-size: 12px;
            }
            .footer {
                padding: 6px 14px;
                font-size: 7px;
            }
        }

        @media (max-width: 480px) {
            .terminal-body {
                font-size: 10px;
                padding: 10px 10px 8px;
            }
            .task-card {
                padding: 10px 12px;
            }
            .task-card .task-title {
                font-size: 11px;
            }
            .detail-view .detail-body {
                font-size: 10px;
                padding: 12px;
            }
            .btn {
                padding: 6px 12px;
                font-size: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>

            // ============================================================

                { text: '▸ ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ БЕЗОПАСНОСТИ AURUM...', cls: 'dim', delay: 120 },
                { text: '▸ ЗАГРУЗКА КРИПТОГРАФИЧЕСКИХ МОДУЛЕЙ...', cls: 'dim', delay: 160 },
                { text: '▸ ПРОВЕРКА ЦЕЛОСТНОСТИ КАНАЛОВ СВЯЗИ...', cls: 'dim', delay: 140 },
                { text: '▸ УСТАНОВЛЕНИЕ ЗАЩИЩЁННОГО СОЕДИНЕНИЯ...', cls: 'dim', delay: 180 },
                { text: '▸ ВЕРИФИКАЦИЯ УЧЁТНЫХ ДАННЫХ...', cls: 'dim', delay: 150 },
                { text: '▸ РАСШИФРОВКА ПРОФИЛЯ ПОЛЬЗОВАТЕЛЯ...', cls: 'dim', delay: 190 },
                { text: '▸ ПРОФИЛЬ: СОТРУДНИК // ДОПУСК: УРОВЕНЬ 3', cls: 'green', delay: 170 },
                { text: '▸ ЗАПРОС КОДА ДОСТУПА...', cls: 'amber', delay: 150 },
                { text: '▸ КОД ПРИНЯТ: 7F-3A-92', cls: 'cyan', delay: 250 },
                { text: '▸ РАСШИФРОВКА КЛЮЧА...', cls: 'dim', delay: 200 },
                { text: '▸ КЛЮЧ ВЕРИФИЦИРОВАН.', cls: 'green', delay: 130 },
                { text: '▸ СКАНИРОВАНИЕ ОКРУЖАЮЩЕЙ СРЕДЫ...', cls: 'dim', delay: 160 },
                { text: '▸ УГРОЗ НЕ ОБНАРУЖЕНО.', cls: 'green', delay: 120 },
                { text: '▸ СИНХРОНИЗАЦИЯ С ЦЕНТРАЛЬНЫМ УЗЛОМ...', cls: 'dim', delay: 180 },
                { text: '▸ ЗАГРУЗКА АКТИВНЫХ ЗАДАНИЙ...', cls: 'dim', delay: 140 },
                { text: '▸ ДАННЫЕ ЗАГРУЖЕНЫ.', cls: 'green', delay: 120 },
                { text: '▸ СИСТЕМА ГОТОВА К РАБОТЕ.', cls: 'green', delay: 200 },
                { text: '', cls: 'separator', delay: 150 },
                { text: '▸ ДОБРО ПОЖАЛОВАТЬ, СОТРУДНИК.', cls: 'bright', delay: 250 },
            ];

            // ============================================================
            // 4. ПЕЧАТЬ СТРОК
            // ============================================================
            let lineIndex = 0;
            let isBootComplete = false;

            function typeLine() {
                if (lineIndex >= BOOT_LOGS.length) {
                    if (!isBootComplete) {
                        isBootComplete = true;
                        setTimeout(showMainPage, 500);
                    }
                    return;
                }

                const entry = BOOT_LOGS[lineIndex];
                const div = document.createElement('div');
                div.className = `line ${entry.cls || ''}`.trim();
                div.textContent = entry.text || '\u00A0';
                output.appendChild(div);
                scrollToBottom();

                lineIndex++;
                const nextDelay = entry.delay || 160;
                setTimeout(typeLine, nextDelay);
            }

            function scrollToBottom() {
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }

            // ============================================================
            // 5. ГЛАВНАЯ СТРАНИЦА
            // ============================================================
            function showMainPage() {
                if (isMainPageShown) return;
                isMainPageShown = true;

                output.innerHTML = '';

                const grid = document.createElement('div');
                grid.className = 'main-grid';
                grid.innerHTML = `
                    <!-- Левое меню -->
                    <div class="menu-panel">
                        <div class="menu-item active" data-page="tasks">ЗАДАНИЯ</div>
                        <div class="menu-item" data-page="archive">АРХИВ</div>
                        <div class="menu-item logout" data-page="logout">ВЫХОД</div>
                    </div>

                    <!-- Центр -->
                    <div class="content-panel" id="contentPanel">
                        <div class="section-label">▸ АКТИВНЫЕ ЗАДАНИЯ</div>
                        <div id="taskList"></div>
                    </div>

                    <!-- Лог -->
                    <div class="log-panel">
                        <div class="section-label">▸ ЛОГ ДЕЙСТВИЙ</div>
                        <div class="log-container" id="logContainer">
                            <div class="log-entry"><span class="time">[СИСТЕМА]</span> <span class="action-green">СЕССИЯ ЗАПУЩЕНА</span></div>
                        </div>
                    </div>
                `;

                output.appendChild(grid);

                renderTasks();
                addLog('СИСТЕМА', 'ДАННЫЕ ЗАГРУЖЕНЫ', 'action-green');

                // Обработчики меню
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const page = this.dataset.page;
                        if (page === 'logout') {
                            addLog('СИСТЕМА', 'ЗАПРОС ВЫХОДА', 'action-red');
                            setTimeout(() => location.reload(), 600);
                            return;
                        }
                        document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                        this.classList.add('active');
                        if (page === 'tasks') {
                            renderTasks();
                            addLog('СИСТЕМА', 'ПЕРЕХОД К ЗАДАНИЯМ', 'action');
                        } else if (page === 'archive') {
                            renderArchive();
                            addLog('СИСТЕМА', 'ОТКРЫТ АРХИВ', 'action');
                        }
                    });
                });

                setInterval(triggerGlitch, 2500);
            }

            // ============================================================
            // 6. РЕНДЕРИНГ ЗАДАНИЙ
            // ============================================================
            function renderTasks() {
                const container = document.getElementById('taskList');
                if (!container) return;
                container.innerHTML = '';

                TASKS.forEach((task, index) => {
                    const card = document.createElement('div');
                    card.className = 'task-card';
                    card.innerHTML = `
                        <div class="task-header">
                            <span class="task-code">${task.code}</span>
                            <span class="task-clearance">${task.clearance}</span>
                        </div>
                        <div class="task-title">${task.title}</div>
                        <div class="task-preview">${task.body.split('\n').slice(0, 2).join(' ')}</div>
                        <div class="task-meta">
                            <span class="status">● АКТИВНО</span>
                            <span>${task.date}</span>
                            <span>${task.sender}</span>
                        </div>
                    `;
                    card.addEventListener('click', () => {
                        addLog('ЗАДАНИЕ', `ОТКРЫТО: ${task.code}`, 'action');
                        showTaskDetail(index);
                    });
                    container.appendChild(card);
                });
            }

            // ============================================================
            // 7. ДЕТАЛЬНЫЙ ПРОСМОТР ЗАДАНИЯ
            // ============================================================
            function showTaskDetail(index) {
                const task = TASKS[index];
                if (!task) return;

                const panel = document.getElementById('contentPanel');
                if (!panel) return;

                panel.innerHTML = `
                    <div class="detail-view">
                        <button class="back-btn" id="backBtn">← НАЗАД К СПИСКУ</button>
                        <div class="detail-header">
                            <div class="line" style="font-size:10px; color:var(--text-dim);">${task.date} // ${task.sender}</div>
                            <div class="line" style="font-size:11px; color:var(--red); letter-spacing:0.05em;">${task.clearance}</div>
                            <div class="line" style="font-size:14px; color:var(--text-bright); font-weight:700; margin:4px 0;">${task.title}</div>
                            <div class="line" style="font-size:10px; color:var(--green);">СТАТУС: АКТИВНО</div>
                        </div>
                        <div class="detail-body">${task.body}</div>
                        <div class="detail-actions">
                            <button class="btn btn-primary" id="acceptBtn">ПРИНЯТЬ</button>
                            <button class="btn btn-danger" id="rejectBtn">ОТКАЗАТЬСЯ</button>
                        </div>
                        <div id="actionFeedback" style="margin-top:10px;"></div>
                    </div>
                `;

                document.getElementById('backBtn').addEventListener('click', () => {
                    addLog('СИСТЕМА', 'ВОЗВРАТ К СПИСКУ', 'action');
                    renderTasks();
                    const p = document.getElementById('contentPanel');
                    if (p) {
                        p.innerHTML = `
                            <div class="section-label">▸ АКТИВНЫЕ ЗАДАНИЯ</div>
                            <div id="taskList"></div>
                        `;
                        renderTasks();
                    }
                });

                document.getElementById('acceptBtn').addEventListener('click', () => {
                    const fb = document.getElementById('actionFeedback');
                    fb.innerHTML = `<span style="color:var(--green); font-size:11px;">→ ЗАДАНИЕ ПРИНЯТО. ДАННЫЕ ЗАФИКСИРОВАНЫ.</span>`;
                    addLog('ЗАДАНИЕ', `ПРИНЯТО: ${task.code}`, 'action-green');
                    document.getElementById('acceptBtn').disabled = true;
                    document.getElementById('rejectBtn').disabled = true;
                });

                document.getElementById('rejectBtn').addEventListener('click', () => {
                    const fb = document.getElementById('actionFeedback');
                    fb.innerHTML = `<span style="color:var(--red); font-size:11px;">→ ОТКАЗ ЗАФИКСИРОВАН. ЗАДАНИЕ ПЕРЕДАНО ДРУГОМУ АГЕНТУ.</span>`;
                    addLog('ЗАДАНИЕ', `ОТКАЗ ОТ ${task.code}`, 'action-red');
                    document.getElementById('acceptBtn').disabled = true;
                    document.getElementById('rejectBtn').disabled = true;
                });
            }

            // ============================================================
            // 8. АРХИВ (ЗАГЛУШКА)
            // ============================================================
            function renderArchive() {
                const panel = document.getElementById('contentPanel');
                if (!panel) return;
                panel.innerHTML = `
                    <div class="section-label">▸ АРХИВ</div>
                    <div class="archive-placeholder">
                        <div class="empty">АРХИВ ПУСТ</div>
                        <div style="font-size:9px; color:var(--text-dim); margin-top:4px;">НЕТ ВЫПОЛНЕННЫХ ЗАДАНИЙ</div>
                    </div>
                `;
            }

            // ============================================================
            // 9. ЛОГ ДЕЙСТВИЙ
            // ============================================================
            function addLog(source, message, type = 'action') {
                const container = document.getElementById('logContainer');
                if (!container) return;
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                entry.innerHTML = `
                    <span class="time">[${time}]</span>
                    <span class="${type}">${source} // ${message}</span>
                `;
                container.appendChild(entry);
                // Ограничиваем количество записей
                while (container.children.length > 50) {
                    container.removeChild(container.firstChild);
                }
                container.scrollTop = container.scrollHeight;
            }

            // ============================================================
            // 10. СЧЁТЧИК ВРЕМЕНИ
            // ============================================================
            let seconds = 0;

            function updateTime() {
                seconds++;
                const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
                const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                sessionTimeEl.textContent = `${h}:${m}:${s}`;
            }

            // ============================================================
            // 11. ГЛИТЧ-ЭФФЕКТ
            // ============================================================
            function triggerGlitch() {
                if (Math.random() > 0.06) return;
                glitchOverlay.classList.add('active');
                setTimeout(() => {
                    glitchOverlay.classList.remove('active');
                }, 120);
            }

            // ============================================================
            // 12. ЗАПУСК
            // ============================================================
            setTimeout(typeLine, 200);
            setInterval(updateTime, 1000);
            setInterval(triggerGlitch, 2000);

            // Случайные технические сообщения
            setInterval(() => {
                if (Math.random() > 0.4 || !isMainPageShown) return;
                const msgs = [
                    'СИНХРОНИЗАЦИЯ ДАННЫХ...',
                    'ПРОВЕРКА ЦЕЛОСТНОСТИ КАНАЛОВ...',
                    'ОБНОВЛЕНИЕ КЭША...',
                    'ОПРОС УЗЛОВ СЕТИ...',
                    'СКАНИРОВАНИЕ ОКРУЖЕНИЯ...'
                ];
                const div = document.createElement('div');
                div.className = 'line dim';
                div.textContent = '> ' + msgs[Math.floor(Math.random() * msgs.length)];
                div.style.opacity = '0.12';
                div.style.fontSize = '9px';
                div.style.color = '#2a2a2a';
                const outputEl = document.getElementById('output');
                if (outputEl) {
                    outputEl.appendChild(div);
                    setTimeout(() => div.remove(), 1200);
                }
            }, 4000);

            console.log('AURUM TERMINAL v7.0 // ЗАПУЩЕН');
        })();
    </script>
</body>
</html>
